name: CrecheCad verification
on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate upgraded schema when bootstrapping this revision
        run: |
          if ! find src/creche_cad.Data/Migrations -name '*CompleteSchoolAccess.cs' | grep -q .; then
            dotnet tool install dotnet-ef --tool-path /tmp/ef --version 10.0.0
            /tmp/ef/dotnet-ef migrations add CompleteSchoolAccess --project src/creche_cad.Data --startup-project src/creche_cad.Api
          fi
          mkdir -p schema
          cp src/creche_cad.Data/Migrations/*CompleteSchoolAccess*.cs schema/
          cp src/creche_cad.Data/Migrations/*Snapshot.cs schema/
      - name: Prepare fictitious demo
        run: cp .env.example .env
      - name: Build and start the full application
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Install verification tools
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify API, workflows and capture the real UI
        run: npm test
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crechecad-verification
          path: |
            schema/
            captures/
            playwright-report/
            test-results/
          retention-days: 14
      - name: Shut down the isolated demo
        if: always()
        run: docker compose down --volumes
