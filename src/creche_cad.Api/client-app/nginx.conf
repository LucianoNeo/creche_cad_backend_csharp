server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;
  client_max_body_size 16m;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream api:8080;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  location /api/ { proxy_pass http://$api_upstream$request_uri; proxy_set_header Host $http_host; }
  location = /health { proxy_pass http://$api_upstream$request_uri; }
  location / { try_files $uri $uri/ /200.html; }
}
